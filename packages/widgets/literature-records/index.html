<div class="t-data lt" data-state="loading">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">文献阅读</h2>
    </div>
    <div class="lt__head-aside">
      <span class="t-data__meta lt__count" data-field="count"></span>
      <button class="lt__primary t-pressable" type="button" data-action="new">新建</button>
    </div>
  </header>

  <div class="lt__toolbar">
    <div class="lt__tabs" role="tablist" aria-label="记录范围">
      <button class="lt__tab" type="button" role="tab" data-view="active" aria-selected="true">活跃</button>
      <button class="lt__tab" type="button" role="tab" data-view="archived" aria-selected="false">归档</button>
      <button class="lt__tab" type="button" role="tab" data-view="trash" aria-selected="false">回收站</button>
    </div>
    <select class="lt__search lt__stage-filter" data-role="stage" aria-label="阅读阶段">
      <option value="">全部阶段</option>
      <option value="queued">待读</option>
      <option value="reading">在读</option>
      <option value="understood">已理解</option>
    </select>
    <input class="lt__search" type="search" data-role="search" aria-label="搜索记录" placeholder="搜索标题、作者、理解与问题" />
  </div>

  <div class="lt__body">
    <div class="t-data__scroll lt__list" data-role="list" hidden></div>
    <div class="lt__note-wrap">
      <p class="t-data__empty lt__note" data-role="note">正在读取记录…</p>
      <button class="lt__ghost lt__retry" type="button" data-action="retry" hidden>重试</button>
    </div>
  </div>

  <section class="lt__detail" data-role="detail" hidden aria-label="记录详情">
    <div class="lt__detail-head">
      <button class="lt__ghost lt__back" type="button" data-action="back">返回</button>
      <span class="lt__state" data-role="detail-state"></span>
      <span class="lt__spacer"></span>
      <button class="lt__ghost" type="button" data-action="open-source" hidden>打开来源</button>
      <button class="lt__ghost" type="button" data-action="archive" hidden>归档</button>
      <button class="lt__ghost" type="button" data-action="restore" hidden>恢复</button>
      <button class="lt__ghost lt__danger" type="button" data-action="trash" hidden>移入回收站</button>
    </div>
    <div class="t-data__scroll lt__detail-body">
      <p class="lt__hint" data-role="detail-hint" hidden></p>
      <p class="lt__hint" data-role="understanding-hint">订阅摘要不代表已经读懂；写下你自己的理解与问题。</p>
      <label class="lt__field">
        <span class="lt__label" data-role="label-title">标题</span>
        <input class="lt__input" type="text" data-field="title-input" maxlength="200" autocomplete="off" />
      </label>
      <div class="lt__pair">
        <label class="lt__field">
          <span class="lt__label" data-role="label-authors">作者</span>
          <input class="lt__input" type="text" data-field="authors-input" autocomplete="off" />
        </label>
        <label class="lt__field">
          <span class="lt__label" data-role="label-venue">期刊或会议</span>
          <input class="lt__input" type="text" data-field="venue-input" autocomplete="off" />
        </label>
        <label class="lt__field">
          <span class="lt__label" data-role="label-year">年份</span>
          <input class="lt__input" type="number" data-field="year-input" min="1000" max="3000" step="1" inputmode="numeric" />
        </label>
      </div>
      <label class="lt__field">
        <span class="lt__label" data-role="label-stage">阅读阶段</span>
        <select class="lt__input" data-field="stage-input">
          <option value="queued">待读</option>
          <option value="reading">在读</option>
          <option value="understood">已理解</option>
        </select>
      </label>
      <div class="lt__pair lt__pair--doi">
        <label class="lt__field">
          <span class="lt__label" data-role="label-format">稿件类型</span>
          <select class="lt__input" data-field="format-input">
            <option value="">未填</option>
            <option value="preprint">预印本</option>
            <option value="published">正式发表</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label class="lt__field">
          <span class="lt__label" data-role="label-doi">DOI</span>
          <span class="lt__lookup">
            <input class="lt__input" type="text" data-field="doi-input" maxlength="200" placeholder="10.1109/…" autocomplete="off" spellcheck="false" />
            <button class="lt__ghost lt__lookup-go" type="button" data-action="lookup-doi">查询 DOI</button>
          </span>
        </label>
      </div>
      <p class="lt__hint lt__lookup-status" data-role="doi-status" role="status"></p>
      <div class="lt__doi-candidates" data-role="doi-candidates" hidden></div>
      <div class="lt__pair">
        <label class="lt__field">
          <span class="lt__label" data-role="label-arxiv">arXiv id</span>
          <input class="lt__input" type="text" data-field="arxiv-input" maxlength="64" placeholder="2611.08850" autocomplete="off" spellcheck="false" />
        </label>
        <label class="lt__field">
          <span class="lt__label" data-role="label-arxiv-version">arXiv 版本</span>
          <input class="lt__input" type="text" data-field="arxiv-version-input" maxlength="16" placeholder="v2" autocomplete="off" spellcheck="false" />
        </label>
      </div>
      <p class="lt__error" data-role="identifier-error" role="status"></p>
      <div class="lt__import-row">
        <button class="lt__ghost" type="button" data-action="open-zotero" data-role="zotero-open">从 Zotero 导入</button>
        <p class="lt__hint" data-role="zotero-hint"></p>
      </div>
      <label class="lt__field">
        <span class="lt__label" data-role="label-url">来源地址</span>
        <input class="lt__input" type="url" data-field="url-input" placeholder="https://…" autocomplete="off" spellcheck="false" />
      </label>
      <p class="lt__error" data-role="url-error" role="status"></p>
      <section class="lt__reading-block" data-role="reading-block" aria-label="阅读记录">
        <div class="lt__reading-head">
          <span class="lt__label" data-role="label-reading">阅读记录</span>
          <button class="lt__ghost" type="button" data-action="add-reading">新增阅读记录</button>
        </div>
        <p class="lt__hint" data-role="reading-hint">记下实际读到的位置；阶段要自己改，读了几节不会自动算全文已读。</p>
        <p class="lt__hint" data-role="reading-empty" hidden></p>
        <ul class="lt__reading-list" data-role="readings"></ul>
        <p class="lt__error" data-role="reading-error" role="status"></p>
      </section>
      <label class="lt__field">
        <span class="lt__label" data-role="label-understanding">理解</span>
        <textarea class="lt__input lt__textarea" rows="3" data-field="understanding"></textarea>
      </label>
      <label class="lt__field">
        <span class="lt__label" data-role="label-questions">问题</span>
        <textarea class="lt__input lt__textarea" rows="2" data-field="questions"></textarea>
      </label>
      <section class="lt__materials" data-role="materials-block" aria-label="材料">
        <span class="lt__label" data-role="label-materials">材料</span>
        <p class="lt__hint" data-role="material-empty" hidden></p>
        <ul class="lt__material-list" data-role="materials"></ul>
        <div class="lt__material-add">
          <label class="lt__material-kind">
            <span class="lt__label" data-role="label-material-kind">来源</span>
            <select class="lt__input" data-role="material-kind">
              <option value="web">网页</option>
              <option value="local">本地路径</option>
            </select>
          </label>
          <input class="lt__input" type="url" data-role="material-url" placeholder="https://…" autocomplete="off" spellcheck="false" />
          <input class="lt__input" type="text" data-role="material-path" maxlength="1024" placeholder="/papers/…" autocomplete="off" spellcheck="false" hidden />
          <input class="lt__input" type="text" data-role="material-title" maxlength="200" placeholder="链接说明" autocomplete="off" />
          <input class="lt__input" type="text" data-role="material-purpose" maxlength="200" placeholder="用途（可选）" autocomplete="off" />
          <input class="lt__input" type="text" data-role="material-device" maxlength="80" placeholder="设备（可选）" autocomplete="off" hidden />
          <input class="lt__input" type="text" data-role="material-version" maxlength="80" placeholder="版本（可选）" autocomplete="off" />
          <input class="lt__input" type="text" data-role="material-checked-at" maxlength="10" placeholder="YYYY-MM-DD" autocomplete="off" />
          <button class="lt__ghost" type="button" data-action="add-material" data-role="material-add">添加</button>
        </div>
        <p class="lt__error" data-role="material-error" role="status"></p>
      </section>
      <div class="lt__detail-actions">
        <button class="lt__primary" type="button" data-action="save">保存</button>
        <button class="lt__ghost" type="button" data-action="close">关闭</button>
      </div>
    </div>
  </section>

  <dialog class="lt__dialog" data-role="confirm">
    <p data-role="confirm-text"></p>
    <div class="lt__dialog-actions">
      <button class="lt__ghost" type="button" data-action="confirm-keep">继续编辑</button>
      <button class="lt__primary" type="button" data-action="confirm-close">关闭并保留草稿</button>
    </div>
  </dialog>

  <dialog class="lt__dialog" data-role="conflict">
    <p data-role="conflict-text"></p>
    <div class="lt__dialog-actions">
      <button class="lt__ghost" type="button" data-action="conflict-keep">继续编辑</button>
      <button class="lt__primary" type="button" data-action="conflict-reload">载入最新（放弃本地修改）</button>
    </div>
  </dialog>

  <dialog class="lt__dialog lt__zotero" data-role="zotero">
    <div class="lt__zotero-head">
      <h3 class="lt__zotero-heading" data-role="zotero-title">从 Zotero 导入</h3>
      <button class="lt__ghost" type="button" data-action="zotero-close">关闭</button>
    </div>
    <p class="lt__hint" data-role="zotero-note"></p>
    <div class="lt__zotero-controls">
      <select class="lt__input" data-role="zotero-library" aria-label="文库"></select>
      <select class="lt__input" data-role="zotero-collection" aria-label="分类"></select>
      <input class="lt__input" type="search" data-role="zotero-search" placeholder="按标题搜索" autocomplete="off" />
      <button class="lt__ghost" type="button" data-role="zotero-search-go">搜索</button>
    </div>
    <div class="lt__zotero-body">
      <div class="t-data__scroll lt__zotero-items" data-role="zotero-items"></div>
      <div class="lt__zotero-preview" data-role="zotero-preview" hidden></div>
    </div>
    <p class="lt__hint" data-role="zotero-status" role="status"></p>
    <div class="lt__dialog-actions">
      <button class="lt__primary" type="button" data-role="zotero-import" disabled>补入空字段</button>
    </div>
  </dialog>

  <p class="w-sr" data-role="sr" aria-live="polite"></p>
</div>
